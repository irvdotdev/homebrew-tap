name: Test Homebrew installation
on:
  push:
    paths: ['Formula/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew tap irvdotdev/tap "$GITHUB_WORKSPACE"
      - run: brew install irvdotdev/tap/bohselecta
      - run: brew test irvdotdev/tap/bohselecta
