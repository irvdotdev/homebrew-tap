name: Test Homebrew installation
on:
  push:
    paths: ['Formula/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Select the requested formula after Homebrew checkout setup
        env:
          BOH_TEST_REF: ${{ inputs.ref || github.sha }}
        run: |
          tap_path="$(brew --repo irvdotdev/tap)"
          git -C "$tap_path" fetch origin "$BOH_TEST_REF"
          git -C "$tap_path" checkout --detach FETCH_HEAD
          brew info irvdotdev/tap/bohselecta
      - name: Unlink the runner's legacy OpenSSL before installing current dependencies
        if: runner.os == 'macOS'
        run: |
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1
          fi
          # The runner also provides an opt-based link that brew unlink misses.
          brew_prefix="$(brew --prefix)"
          openssl_link="$brew_prefix/bin/openssl"
          if [ -L "$openssl_link" ] && [ "$(readlink "$openssl_link")" = "$brew_prefix/opt/openssl@1.1/bin/openssl" ]; then
            rm "$openssl_link"
          fi
      - run: brew install irvdotdev/tap/bohselecta
      - run: brew test irvdotdev/tap/bohselecta
