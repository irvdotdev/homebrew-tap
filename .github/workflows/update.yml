name: Update released formula
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/update.py
      - name: Commit verified release formula
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/bohselecta.rb
          git commit -m 'Update bohselecta to the latest released formula'
          git push

  test:
    needs: update
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
